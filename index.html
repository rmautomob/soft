    <script>
      (function() {
        try {
          var saved = localStorage.getItem('RM_THEME');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
            if (!saved) localStorage.setItem('RM_THEME', 'light');
          }
        } catch (e) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <script type="module" crossorigin src="/soft/assets/index-C78FSFjk.js"></script>
    <link rel="stylesheet" crossorigin href="/soft/assets/index-CL1f4vbt.css">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-amber-500 selection:text-white">
    <div id="root">
      <div id="rm-boot-loader" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:'Hind Siliguri','Plus Jakarta Sans',system-ui,sans-serif;background:#f8fafc;color:#0f172a;padding:24px;text-align:center;">
        <div style="width:42px;height:42px;border-radius:12px;border:3px solid #e2e8f0;border-top-color:#f59e0b;animation:rmSpin 0.8s linear infinite;"></div>
        <div style="font-weight:800;font-size:16px;">RM Automobiles লোড হচ্ছে...</div>
        <div id="rm-boot-status" style="font-size:12px;color:#475569;">অনুগ্রহ করে কয়েক সেকেন্ড অপেক্ষা করুন</div>
        <button id="rm-boot-reload" type="button" onclick="window.location.reload()" style="display:none;margin-top:8px;padding:10px 18px;border-radius:10px;border:none;background:#f59e0b;color:#0f172a;font-weight:800;font-size:13px;cursor:pointer;">
          পুনরায় লোড করুন (Reload)
        </button>
      </div>
      <style>@keyframes rmSpin{to{transform:rotate(360deg)}}</style>
    </div>
    <script>
      (function() {
        var showFallback = function(msg) {
          var statusEl = document.getElementById('rm-boot-status');
          var btnEl = document.getElementById('rm-boot-reload');
          if (statusEl) statusEl.textContent = msg || 'অ্যাপ লোড হতে সময় লাগছে। পুনরায় লোড করুন।';
          if (btnEl) btnEl.style.display = 'inline-block';
        };
        window.addEventListener('error', function(e) {
          if (document.getElementById('rm-boot-loader')) {
            showFallback('লোড ত্রুটি: ' + (e && e.message ? e.message : 'নেটওয়ার্ক বা ব্রাউজার ক্যাশ সমস্যা'));
          }
        });
        window.addEventListener('unhandledrejection', function(e) {
          if (document.getElementById('rm-boot-loader')) {
            var reason = e && e.reason ? (e.reason.message || String(e.reason)) : 'লোড সম্পন্ন হয়নি';
            showFallback('লোড ত্রুটি: ' + reason);
          }
        });
        setTimeout(function() {
          if (document.getElementById('rm-boot-loader')) {
            showFallback('লোড হতে স্বাভাবিকের চেয়ে বেশি সময় লাগছে। নিচের বাটনে ক্লিক করে পুনরায় লোড দিন।');
          }
        }, 10000);
      })();
    </script>
  </body>
</html>
